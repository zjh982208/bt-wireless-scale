workflows:
  ios-release-ipa:
    name: iOS Release IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: "com.sounding.blescale"
        APP_STORE_APPLE_ID: "0000000000"
        TESTFLIGHT_BETA_GROUP: "BLE scale"

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Setup iOS code signing
        script: |
          keychain initialize
          # Flutter 导出 IPA 前会检查 Apple Development 证书，先创建并装入钥匙串。
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_DEVELOPMENT --create
          keychain add-certificates
          # 清掉开发描述文件，避免导出时误用 development。
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - $TESTFLIGHT_BETA_GROUP

