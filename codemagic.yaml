workflows:
  ios-release-ipa:
    name: iOS Release IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials
        - ios_distribution_key
      vars:
        BUNDLE_ID: "com.sounding.blescale"
        APP_STORE_APPLE_ID: "0000000000"
        TESTFLIGHT_BETA_GROUP: "BLE scale"

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Setup iOS code signing
        script: |
          python3 << 'PY'
          import os, re, sys
          issuer = os.environ.get("APP_STORE_CONNECT_ISSUER_ID", "").strip()
          key_id = os.environ.get("APP_STORE_CONNECT_KEY_IDENTIFIER", "").strip()
          api_key = os.environ.get("APP_STORE_CONNECT_PRIVATE_KEY", "").replace("\r\n", "\n").replace("\r", "\n")
          cert_key = os.environ.get("CERTIFICATE_PRIVATE_KEY", "").replace("\r\n", "\n").replace("\r", "\n")

          def header(text):
              lines = [line.strip() for line in text.strip().splitlines() if line.strip()]
              return lines[0] if lines else ""

          api_header = header(api_key)
          cert_header = header(cert_key)
          print("ISSUER_ID length=%s" % len(issuer))
          print("KEY_ID length=%s" % len(key_id))
          print("APP_STORE_CONNECT_PRIVATE_KEY header=%s length=%s" % (api_header or "<empty>", len(api_key.strip())))
          print("CERTIFICATE_PRIVATE_KEY header=%s length=%s" % (cert_header or "<empty>", len(cert_key.strip())))
          errors = []
          if not re.fullmatch(r"[0-9a-fA-F-]{36}", issuer):
              errors.append("APP_STORE_CONNECT_ISSUER_ID must be the Issuer ID UUID from App Store Connect > Users and Access > Integrations.")
          if not re.fullmatch(r"[A-Za-z0-9]{10}", key_id):
              errors.append("APP_STORE_CONNECT_KEY_IDENTIFIER must be the 10-character Key ID. It is the suffix of AuthKey_XXXXXXXXXX.p8.")
          if api_header == "-----BEGIN RSA PRIVATE KEY-----":
              errors.append("APP_STORE_CONNECT_PRIVATE_KEY is the desktop certificate key. Paste the .p8 file, which starts with -----BEGIN PRIVATE KEY-----.")
          elif api_header != "-----BEGIN PRIVATE KEY-----":
              errors.append("APP_STORE_CONNECT_PRIVATE_KEY must start with -----BEGIN PRIVATE KEY-----.")
          if cert_header != "-----BEGIN RSA PRIVATE KEY-----":
              errors.append("CERTIFICATE_PRIVATE_KEY must be the desktop file and start with -----BEGIN RSA PRIVATE KEY-----.")
          if api_key.strip() and api_key.strip() == cert_key.strip():
              errors.append("The two private keys are the same file. Use the .p8 for the API key and the desktop file for CERTIFICATE_PRIVATE_KEY.")
          if errors:
              print("Credential check failed:")
              for item in errors:
                  print("- " + item)
              sys.exit(1)
          with open("/tmp/ios_distribution_private_key", "w", encoding="utf-8") as key_file:
              key_file.write(cert_key.strip() + "\n")
          print("Credential format check passed")
          PY
          unset CERTIFICATE_PRIVATE_KEY
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create \
            --issuer-id "@env:APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "@env:APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "@env:APP_STORE_CONNECT_PRIVATE_KEY" \
            --certificate-key "@file:/tmp/ios_distribution_private_key"
          keychain add-certificates

      - name: Build IPA
        script: |
          # flutter build ipa 只认 Development 证书，会忽略 Apple Distribution。
          # 先生成 Flutter 配置，再用 Xcode 按 App Store 证书归档。
          flutter build ios --config-only --release
          xcode-project use-profiles
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -destination "generic/platform=iOS" -archivePath "$CM_BUILD_DIR/build/Runner.xcarchive" archive COMPILER_INDEX_STORE_ENABLE=NO
          xcodebuild -exportArchive -archivePath "$CM_BUILD_DIR/build/Runner.xcarchive" -exportPath "$CM_BUILD_DIR/build/ios/ipa" -exportOptionsPlist "/Users/builder/export_options.plist"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - $TESTFLIGHT_BETA_GROUP

